# docker-compose.dev.yml
# Local development configuration.
# Uses local builds instead of the registry images.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  lighthouse:
    # Override the registry image with a local build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 0.0.1-dev
        ASSEMBLY_VERSION: 0.0.1
        BUILD_DATE: "2026-01-27"
        VCS_REF: dev
        VITE_APP_VERSION: 0.0.1-dev
        VITE_BUILD_DATE: "2026-01-27"
        VITE_GIT_COMMIT: dev
    image: lighthouse:dev
    environment:
      # Development configuration
      - ASPNETCORE_ENVIRONMENT=Development
      - Serilog__MinimumLevel__Default=Debug
    volumes:
      # Sample compose files for testing discovery (override with your own path if needed)
      - ./dev-setup/sample-compose-files:/app/compose-files
