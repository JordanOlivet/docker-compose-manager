name: PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  extract-version:
    name: Extract Version
    uses: JordanOlivet/ci-workflows/.github/workflows/extract-version.yml@v1
    with:
      source: file
      path: VERSION

  backend-build-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout backend
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: ./.github/actions/setup-dotnet
      - name: Restore dependencies
        working-directory: ./lighthouse-back
        run: dotnet restore
      - name: Build backend
        working-directory: ./lighthouse-back
        run: |
          dotnet build --configuration Release --no-restore \
            -p:Version=${{ needs.extract-version.outputs.assembly_version }} \
            -p:AssemblyVersion=${{ needs.extract-version.outputs.assembly_version }} \
            -p:FileVersion=${{ needs.extract-version.outputs.assembly_version }} \
            -p:InformationalVersion=${{ needs.extract-version.outputs.version }}
      - name: Run backend tests
        working-directory: ./lighthouse-back
        run: dotnet test --no-build --configuration Release --verbosity minimal

  frontend-build-test:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7
      - name: Setup Node.js 24
        uses: ./.github/actions/setup-node
      - name: Install dependencies
        working-directory: ./lighthouse-front
        run: npm ci
      - name: Build frontend
        working-directory: ./lighthouse-front
        env:
          VITE_API_URL: /api
          VITE_APP_VERSION: ${{ needs.extract-version.outputs.version }}
          VITE_BUILD_DATE: ${{ needs.extract-version.outputs.build_date }}
          VITE_GIT_COMMIT: ${{ needs.extract-version.outputs.vcs_ref }}
        run: npm run build
      - name: Run frontend type checking
        working-directory: ./lighthouse-front
        run: npm run check
      - name: Lint frontend
        working-directory: ./lighthouse-front
        run: npm run lint
      - name: Run frontend tests
        working-directory: ./lighthouse-front
        run: npm run test

  docker-build-push:
    name: Docker - Build & Push
    runs-on: ubuntu-latest
    needs: [extract-version, backend-build-test, frontend-build-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sanitize branch name for Docker tag
        id: branch
        run: |
          # Get branch name and replace / with -
          BRANCH_NAME="${{ github.head_ref }}"
          # Underscores excluded: the tag is also used as the NuGet /p:Version
          # prerelease suffix, where SemVer forbids '_' (e.g. dependabot/github_actions/* branches)
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9.-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          echo "tag=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME -> Tag: $SANITIZED_BRANCH"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.extract-version.outputs.base_version }}-${{ steps.branch.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest-dev
          cache-from: type=gha,scope=pr-${{ steps.branch.outputs.tag }}
          cache-to: type=gha,scope=pr-${{ steps.branch.outputs.tag }},mode=max
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.extract-version.outputs.base_version }}-${{ steps.branch.outputs.tag }}
            ASSEMBLY_VERSION=${{ needs.extract-version.outputs.assembly_version }}
            BUILD_DATE=${{ needs.extract-version.outputs.build_date }}
            VCS_REF=${{ needs.extract-version.outputs.vcs_ref }}
            VITE_APP_VERSION=${{ needs.extract-version.outputs.base_version }}-${{ steps.branch.outputs.tag }}
            VITE_BUILD_DATE=${{ needs.extract-version.outputs.build_date }}
            VITE_GIT_COMMIT=${{ needs.extract-version.outputs.vcs_ref }}

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-test, docker-build-push]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "Backend build status: ${{ needs.backend-build-test.result }}"
          echo "Frontend build status: ${{ needs.frontend-build-test.result }}"
          echo "Docker build status: ${{ needs.docker-build-push.result }}"
          if [[ "${{ needs.backend-build-test.result }}" == "failure" ]] || [[ "${{ needs.frontend-build-test.result }}" == "failure" ]]; then
            echo "❌ One or more builds failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build-push.result }}" == "failure" ]]; then
            echo "⚠️ Docker build failed"
            exit 1
          fi
          echo "✅ All builds, tests and Docker push passed successfully"
