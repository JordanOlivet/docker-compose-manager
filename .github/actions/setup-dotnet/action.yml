name: 'Setup .NET Environment'
description: 'Setup .NET SDK with caching for the backend project'
runs:
  using: 'composite'
  steps:
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: lighthouse-back/lighthouse-back/*.csproj
